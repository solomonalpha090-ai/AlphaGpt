<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI Assistant - ChatGPT Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar (hidden on mobile, shown on desktop) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="new-chat-btn">+ New chat</div>
            </div>
            <div class="chat-history">
                <div class="history-item">Today</div>
                <div class="history-item">Previous 7 days</div>
            </div>
        </div>

        <!-- Main chat area -->
        <div class="main">
            <div class="chat-header">
                <div class="model-selector">AI Tutor v1.0</div>
                <div class="settings">⚙️</div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-message">
                    <div class="welcome-icon">🤖</div>
                    <h2>How can I help you today?</h2>
                    <p>Ask me math, coding, science, or homework questions.</p>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Ask anything..." rows="1"></textarea>
                    <button id="sendBtn">➤</button>
                </div>
                <div class="disclaimer">Offline AI - solves equations & answers basic questions</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
