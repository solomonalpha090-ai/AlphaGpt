<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaGPT AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="sidebar">
    <h2>AlphaGPT</h2>
    <button onclick="clearChat()">New Chat</button>
  </div>

  <div class="main">

    <div class="topbar">
      <h1>AlphaGPT AI</h1>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <div class="input-area">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask AlphaGPT anything..."
      >

      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
